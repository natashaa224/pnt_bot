controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    paint_bot:
      type: diff_drive_controller/DiffDriveController

    paint_axis_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

paint_bot:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.576
    wheel_radius: 0.10

    publish_rate: 50.0

    odom_frame_id: odom
    base_frame_id: base_footprint

    use_stamped_vel: false
    cmd_vel_timeout: 0.5

    open_loop: false
    enable_odom_tf: true

    publish_cmd: true
    publish_wheel_data: true

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.8
    linear.x.min_velocity: -0.8
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.5

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 2.5

paint_axis_controller:
  ros__parameters:
    joints:
      - zAxis_joint
      - wrist_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    control_period: 0.01
    trajectory_duration: 0.5
    trajectory_duration_type: joint