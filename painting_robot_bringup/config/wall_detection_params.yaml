wall_detection_node:
  ros__parameters:
    right_center_deg:   275.0   # right-wall arc center (260-290 with spread 15)
    right_spread_deg:   15.0
    right_max_fit_dist: 1.75    # m — caps right-arc points before RANSAC; keeps ~0.9m suck-ins
    min_range: 0.15              # m
    max_range: 12.0              # m — RPLidar C1 max
    ray_window: 5                # median filter window per ray
    min_points: 5                # min points for valid PCA fit
    publish_rate: 10.0           # Hz
    